    <script>(function(){try{var t=localStorage.getItem('medistore_theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);if(t==='dark'){document.documentElement.classList.add('dark');}var m=document.querySelector('meta[name="theme-color"]');if(m){m.setAttribute('content',t==='dark'?'#070E1F':t==='aesthetic'?'#FDE9DC':'#F5F1E8');}}catch(e){}})();</script>
